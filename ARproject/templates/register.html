{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>申请权限 - AR REALM</title>
    <!-- 引入科幻字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffd700;
        }

        body {
            margin: 0; background: #050608; color: #fff;
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-image: radial-gradient(circle at center, #10141d 0%, #050608 100%);
            overflow: hidden;
        }

        .auth-box {
            background: rgba(20, 15, 10, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 50px;
            width: 380px;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: inset 0 0 30px rgba(255, 215, 0, 0.05);
            transition: 0.3s;
        }

        .auth-box:hover {
            box-shadow: inset 0 0 50px rgba(255, 215, 0, 0.1);
        }

        .auth-box h2 {
            color: var(--gold);
            font-family: 'Syncopate', sans-serif;
            letter-spacing: 3px;
            margin-bottom: 30px;
            font-size: 22px;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label {
            display: block; font-size: 11px;
            color: rgba(255,215,0,0.7);
            margin-bottom: 6px; font-family: 'Syncopate', sans-serif;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%; padding: 12px 15px;
            background: rgba(255,215,0,0.02);
            border: 1px dashed rgba(255,215,0,0.3);
            color: #fff; font-family: 'Rajdhani', sans-serif;
            font-size: 16px; box-sizing: border-box; transition: 0.3s;
        }
        .input-group input:focus {
            border-style: solid; border-color: var(--gold); outline: none;
            background: rgba(255,215,0,0.08);
            box-shadow: 0 0 15px rgba(255,215,0,0.2);
        }

        .btn-submit {
            width: 100%; padding: 15px;
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid var(--gold);
            color: var(--gold); font-family: 'Syncopate', sans-serif;
            font-weight: bold; font-size: 14px; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; margin-top: 15px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        /* 支持 AR 光标悬停 */
        .btn-submit:hover, .btn-submit.ar-hover {
            background: var(--gold); color: #000;
            box-shadow: 0 0 25px var(--gold);
        }

        .auth-links { margin-top: 25px; font-size: 13px; }
        .auth-links a { color: #777; text-decoration: none; transition: 0.3s; }
        .auth-links a:hover, .auth-links a.ar-hover { color: var(--gold); text-shadow: 0 0 8px var(--gold); }

        #gesture-status-text {
            position: fixed; top: 25px; right: 35px;
            color: var(--gold); font-family: 'Syncopate', sans-serif;
            font-size: 12px; letter-spacing: 2px; z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="gesture-status-text">CONNECTING...</div>

    <div class="auth-box">
        <h2>REQ_ACCESS</h2>
        <form method="post" action="/register/">
            {% csrf_token %}
            <div class="input-group">
                <label>NEW USER_ID</label>
                <input type="text" name="username" placeholder="英文或数字" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>COM_EMAIL</label>
                <input type="email" name="email" placeholder="接收节点数据" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>NEW ENCRYPTION KEY</label>
                <input type="password" name="password" placeholder="建议使用复杂组合" required>
            </div>
            <button type="submit" class="btn-submit">写入安全协议 (REGISTER)</button>
        </form>

        <div class="auth-links">
            <a href="{% url 'login' %}">◄ 取消建档，返回系统登录</a>
        </div>

        <!-- 错误信息动态展示 -->
        {% if messages %}
            <div style="color: #ff3e3e; margin-top: 15px; font-size: 13px; background: rgba(255, 62, 62, 0.1); padding: 10px; border: 1px solid #ff3e3e;">
                {% for msg in messages %}{{ msg }}{% endfor %}
            </div>
        {% endif %}
    </div>

    <!-- 统一载入最新 AR 引擎 -->
    <script src="{% static 'js/gesture.js' %}"></script>
</body>
</html>
