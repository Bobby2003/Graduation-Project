{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>404 - 链路中断 - AR REALM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; background: #050608; color: #ff3e3e;
            font-family: 'Rajdhani', sans-serif; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #1a0505 0%, #050608 100%);
        }

        .error-container {
            text-align: center; max-width: 600px; padding: 40px 60px;
            border: 1px solid rgba(255, 62, 62, 0.3);
            background: rgba(255, 62, 62, 0.02);
            backdrop-filter: blur(10px); position: relative;
            box-shadow: inset 0 0 30px rgba(255, 62, 62, 0.05);
            /* 基础故障动画 */
            animation: glitch-box 4s infinite alternate;
        }

        @keyframes glitch-box {
            0%, 95% { border-color: rgba(255, 62, 62, 0.3); transform: translate(0); }
            96% { border-color: #fff; transform: translate(5px, -5px); box-shadow: 0 0 20px #ff3e3e;}
            97% { border-color: rgba(255, 62, 62, 0.3); transform: translate(-3px, 3px); }
            100% { border-color: #ff3e3e; transform: translate(0); }
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 8rem; margin: 0; line-height: 1;
            letter-spacing: -5px; position: relative;
        }

        .glitch-text::before, .glitch-text::after {
            content: '404'; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: transparent;
        }
        .glitch-text::before { color: #00f2ff; left: 2px; text-shadow: -2px 0 #ff3e3e; clip: rect(44px, 450px, 56px, 0); animation: glitch 3s infinite linear alternate-reverse; }
        .glitch-text::after { color: #ff3e3e; left: -2px; text-shadow: -2px 0 #00f2ff; clip: rect(44px, 450px, 56px, 0); animation: glitch 2s infinite linear alternate-reverse; }

        @keyframes glitch {
            0% { clip: rect(10px, 9999px, 85px, 0); }
            20% { clip: rect(60px, 9999px, 40px, 0); }
            40% { clip: rect(20px, 9999px, 80px, 0); }
            100% { clip: rect(70px, 9999px, 60px, 0); }
        }

        .status-code {
            font-family: 'Syncopate', sans-serif; font-size: 16px;
            letter-spacing: 5px; margin-top: 10px; color: #ff3e3e;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        }

        .message { margin: 30px 0; font-size: 16px; color: #aaa; letter-spacing: 2px; }

        .btn-home {
            display: inline-block; padding: 15px 40px;
            border: 1px solid #ff3e3e; color: #ff3e3e;
            text-decoration: none; font-family: 'Syncopate', sans-serif;
            font-size: 14px; font-weight: bold; transition: 0.3s;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            background: rgba(255, 62, 62, 0.05);
        }

        /* 重点：按钮自身的 AR UX 反应 */
        .btn-home:hover, .btn-home.ar-hover {
            background: #ff3e3e; color: #050608;
            box-shadow: 0 0 30px #ff3e3e, inset 0 0 10px #fff;
            transform: scale(1.05);
            letter-spacing: 3px;
        }

        /* 背景全局微弱扫描线 */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(255, 62, 62, 0.05) 50%, rgba(255, 62, 62, 0.05));
            background-size: 100% 4px; z-index: 50; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="error-container">
        <h1 class="glitch-text">404</h1>
        <div class="status-code">NEURAL_LINK_TERMINATED</div>
        <p class="message">警告：目标神经节点不存在或已被主脑阻断。</p>
        <a href="/" class="btn-home">↺ REBOOT SYSTEM</a>
    </div>

    <!-- 同样引入手势引擎，确保即使在 404 也能用手势点回去 -->
    <script src="{% static 'js/gesture.js' %}"></script>
</body>
</html>
