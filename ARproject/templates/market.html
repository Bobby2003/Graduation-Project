{% load static %}
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>黑市交易所 - AR REALM</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; background: #050608; color: #fff;
            font-family: 'Rajdhani', sans-serif; min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at top center, #150020 0%, #050608 80%);
        }

        /* 顶部导航控制条 */
        .top-nav {
            position: sticky;
            top: 0;
            padding: 15px 30px;
            background: rgba(5, 6, 8, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(188, 0, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .nav-center {
            display: flex;
            gap: 5px;
        }
        .nav-center a {
            padding: 8px 14px;
            font-family: 'Syncopate', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .nav-center a:hover, .nav-center a.active {
            color: #bc00ff;
            border-color: rgba(188, 0, 255, 0.3);
            background: rgba(188, 0, 255, 0.05);
        }

        .btn-return {
            background: rgba(188, 0, 255, 0.05); border: 1px solid #bc00ff;
            color: #bc00ff; font-family: 'Syncopate', sans-serif; font-size: 12px;
            padding: 8px 20px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: 0.3s;
        }

        .btn-return:hover, .btn-return.ar-hover {
            background: #bc00ff; color: #fff; box-shadow: 0 0 15px #bc00ff;
        }

        .page-title { font-family: 'Syncopate'; font-size: 20px; color: #bc00ff; letter-spacing: 4px; text-shadow: 0 0 10px #bc00ff; }

        /* 商品网格区域 */
        .market-container {
            padding: 40px; max-width: 1200px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;
        }

        .market-card {
            background: rgba(20, 10, 30, 0.6);
            border: 1px solid rgba(188, 0, 255, 0.2);
            padding: 20px; position: relative; transition: 0.3s;
        }
        .market-card:hover, .market-card.ar-hover {
            transform: translateY(-5px); border-color: #bc00ff;
            box-shadow: 0 10px 30px rgba(188, 0, 255, 0.15);
        }

        .item-image-placeholder {
            height: 150px; background: rgba(0,0,0,0.5);
            border: 1px dashed rgba(188, 0, 255, 0.3);
            display: flex; align-items: center; justify-content: center;
            color: #555; margin-bottom: 15px; font-family: 'Syncopate';
        }

        .item-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .item-desc { font-size: 12px; color: #888; margin-bottom: 15px; line-height: 1.5; }

        .buy-row { display: flex; justify-content: space-between; align-items: center; }
        .price { color: #ffd700; font-size: 18px; font-weight: bold; }

        .btn-buy {
            background: transparent; border: 1px solid #ffd700; color: #ffd700;
            padding: 6px 15px; font-family: 'Syncopate'; font-size: 12px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-buy:hover, .btn-buy.ar-hover { background: #ffd700; color: #000; box-shadow: 0 0 15px #ffd700; }

        #gesture-status-text { color: #bc00ff; font-family: 'Syncopate'; font-size: 12px; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="{% url 'dashboard' %}" class="btn-return">◄ HUD</a>
        <div class="page-title">BLACK MARKET</div>
        <div class="nav-center">
            <a href="{% url 'dashboard' %}">终端</a>
            <a href="{% url 'missions' %}">任务</a>
            <a href="{% url 'achievements' %}">成就</a>
            <a href="{% url 'equipment' %}">装备</a>
            <a href="{% url 'market' %}" class="active">黑市</a>
            <a href="{% url 'ranking' %}">排行</a>
            <a href="{% url 'settings' %}">设置</a>
        </div>
        <div id="gesture-status-text">CONNECTING...</div>
    </div>

    <!-- 商品列表区域 -->
    <div class="market-container">

        <!-- 静态演示卡片 1 -->
        <div class="market-card">
            <div class="item-image-placeholder">IMG_DATA_LOST</div>
            <div class="item-name">神经反应增强剂 v2.0</div>
            <div class="item-desc">大幅提升 AR 手势捕获帧率，降低脑机接口连接延迟 15%。</div>
            <div class="buy-row">
                <div class="price">₮ 1,200</div>
                <button class="btn-buy">TRADE</button>
            </div>
        </div>

        <!-- 静态演示卡片 2 -->
        <div class="market-card" style="border-color: rgba(0, 242, 255, 0.4);">
            <div class="item-image-placeholder">IMG_DATA_LOST</div>
            <div class="item-name" style="color: #00f2ff;">钛合金光学镜片</div>
            <div class="item-desc">基础护甲插件。提供额外的光谱扫描过滤功能。</div>
            <div class="buy-row">
                <div class="price">₮ 850</div>
                <button class="btn-buy" style="border-color: #00f2ff; color:#00f2ff;">TRADE</button>
            </div>
        </div>

        <!-- 静态演示卡片 3 -->
        <div class="market-card">
            <div class="item-image-placeholder">IMG_DATA_LOST</div>
            <div class="item-name">废弃的机甲核心</div>
            <div class="item-desc">从现实战区回收的未知动力核心，可用于合成强力位面协议。</div>
            <div class="buy-row">
                <div class="price">₮ 3,500</div>
                <button class="btn-buy">TRADE</button>
            </div>
        </div>
    </div>

    <!-- 统一引入 AR 手势 -->
    <script src="{% static 'js/gesture.js' %}"></script>
</body>
</html>
