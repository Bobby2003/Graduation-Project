<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D视觉还原：高密度与遮挡挑战</title>
    <!-- 引入 Three.js 核心库 (UMD版本) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <!-- 引入 轨道控制器 用于旋转视角 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; font-family: 'Microsoft YaHei', sans-serif; background: #000; color: white; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #top-row { flex: 1; border-bottom: 2px solid #333; position: relative; }
        #bottom-row { height: 260px; display: flex; background: #050505; }
        .local-view { flex: 1; border-right: 1px solid #222; position: relative; }
        .label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 12px; z-index: 10; border: 1px solid #444; }

        #ui { position: absolute; left: 20px; top: 20px; width: 280px; background: rgba(15,15,15,0.9); padding: 20px; border-radius: 10px; z-index: 100; border: 1px solid #007bff; }
        .metric { font-family: 'Consolas', monospace; color: #00ff77; font-size: 13px; margin: 5px 0; }
        input[type=range] { width: 100%; margin: 10px 0; cursor: pointer; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        #loading-hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #555; z-index: 1; }
    </style>
</head>
<body>

<div id="loading-hint">正在加载 3D 引擎，请确保网络连接...</div>

<div id="ui">
    <div style="font-size: 14px; margin-bottom: 10px; color: #ffcc00; font-weight: bold;">🔴 3D 高密度遮挡实验</div>
    <button onclick="regenScene()">🔄 刷新场景 (随机障碍物)</button>

    <div style="margin-top:20px;">
        <label style="font-size: 11px; color: #aaa;">相机实际间距 (Ground Truth):</label>
        <input type="range" id="inputB" min="2" max="10" step="0.1" value="5">
    </div>

    <div style="background: #111; padding: 10px; border-radius: 5px; margin-top: 10px;">
        <div class="metric">真实距离: <span id="txtRealB">--</span> m</div>
        <div class="metric" style="color:#00ccff">算法估算: <span id="txtEstB">--</span> m</div>
        <div class="metric" style="color:#ffffff">点云密度: 7,200 pts</div>
    </div>

    <p style="font-size: 10px; color: #666; margin-top: 15px; line-height: 1.4;">
        <b>运行提示：</b><br>
        1. <b>鼠标左键</b>：旋转场景观看 3D 结构。<br>
        2. <b>滚轮</b>：缩放观察物体细节。<br>
        3. <b>白色点云</b>：根据算法算出的距离还原出的结果。
    </p>
</div>

<div id="top-row">
    <div class="label">主视图：场景拼接还原</div>
</div>

<div id="bottom-row">
    <div class="local-view" id="v1"><div class="label">相机 1：本地深度图</div></div>
    <div class="local-view" id="v2"><div class="label">相机 2：本地深度图</div></div>
</div>

<script>
// --- 检测库是否加载 ---
window.onload = function() {
    if (typeof THREE === 'undefined') {
        document.getElementById('loading-hint').innerHTML = "❌ 无法加载 Three.js 库，请检查互联网连接。";
        return;
    }
    document.getElementById('loading-hint').style.display = 'none';
    startSim();
};

function startSim() {
    let sceneM, sceneL1, sceneL2, renderer;
    let camM, camL1, camL2, ctrlM;
    let wallMesh, obstacle, ptsRec, ptsL1, ptsL2;
    let c1Model, c2Model;

    const SCAN_RES = 60; // 60x60 高密度
    let wallFunc = (x,y) => 0;

    // 1. 初始化
    sceneM = new THREE.Scene();
    sceneL1 = new THREE.Scene();
    sceneL2 = new THREE.Scene();

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 相机设置
    camM = new THREE.PerspectiveCamera(45, window.innerWidth / (window.innerHeight - 260), 0.1, 1000);
    camM.position.set(15, 12, 20);

    camL1 = new THREE.PerspectiveCamera(50, (window.innerWidth/2) / 260, 0.1, 100);
    camL1.position.set(0, 5, 12);
    camL2 = camL1.clone();

    // 控制器
    ctrlM = new THREE.OrbitControls(camM, renderer.domElement);

    // 2. 物体
    const createPoints = (color, size) => {
        const geo = new THREE.BufferGeometry();
        const mat = new THREE.PointsMaterial({ size: size, color: color });
        const p = new THREE.Points(geo, mat);
        p.frustumCulled = false; // 防止点云消失
        return p;
    };

    ptsRec = createPoints(0xffffff, 0.04);
    ptsL1 = createPoints(0x0077ff, 0.05);
    ptsL2 = createPoints(0x00ff77, 0.05);

    sceneM.add(ptsRec);
    sceneL1.add(ptsL1);
    sceneL2.add(ptsL2);

    const box = new THREE.BoxGeometry(0.5, 0.3, 0.2);
    c1Model = new THREE.Mesh(box, new THREE.MeshBasicMaterial({color: 0x0077ff}));
    c2Model = new THREE.Mesh(box, new THREE.MeshBasicMaterial({color: 0x00ff77}));
    sceneM.add(c1Model, c2Model);

    // 3. 场景生成
    window.regenScene = function() {
        if(wallMesh) sceneM.remove(wallMesh);
        if(obstacle) sceneM.remove(obstacle);

        const seed = Math.random() * 10;
        wallFunc = (x, y) => 1.5 * Math.sin(x*0.4 + seed) + 1.2 * Math.cos(y*0.5 + seed);

        const wallGeo = new THREE.PlaneGeometry(40, 30, 40, 40);
        const pos = wallGeo.attributes.position;
        for(let i=0; i<pos.count; i++) {
            pos.setZ(i, wallFunc(pos.getX(i), pos.getY(i)));
        }
        wallMesh = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({color: 0x222222, wireframe: true, transparent: true, opacity: 0.1}));
        wallMesh.position.z = -6;
        sceneM.add(wallMesh);

        const obsGeo = new THREE.TorusKnotGeometry(1.5, 0.5, 64, 8);
        obstacle = new THREE.Mesh(obsGeo, new THREE.MeshNormalMaterial({wireframe: true}));
        obstacle.position.set((Math.random()-0.5)*10, 2, 1);
        sceneM.add(obstacle);
    };

    // 4. 扫描算法
    function scan(camPos) {
        const pts = [];
        const fov = 45 * Math.PI / 180;
        const obstacleP = obstacle.position;

        for(let i=0; i<SCAN_RES; i++) {
            for(let j=0; j<SCAN_RES; j++) {
                const ry = (i/SCAN_RES - 0.5) * fov;
                const rp = (j/SCAN_RES - 0.5) * fov;
                const dir = new THREE.Vector3(Math.sin(ry), Math.sin(rp), -Math.cos(ry)).normalize();

                let dist = 30;
                // 简化碰撞检测：检查是否穿过障碍物区域
                const toObs = obstacleP.clone().sub(camPos);
                const tca = toObs.dot(dir);
                if(tca > 0) {
                    const d2 = toObs.dot(toObs) - tca*tca;
                    if(d2 < 4) { // 障碍物包围球半径约2
                        dist = tca - Math.sqrt(4 - d2);
                    }
                }

                // 墙面检测
                if(dist > 5) {
                    for(let d=5; d<25; d+=0.4) {
                        let tp = dir.clone().multiplyScalar(d).add(camPos);
                        if(tp.z <= -6 + wallFunc(tp.x, tp.y)) {
                            dist = Math.min(dist, d);
                            break;
                        }
                    }
                }

                if(dist < 25) {
                    pts.push({ local: dir.multiplyScalar(dist), dist: dist });
                }
            }
        }
        return pts;
    }

    // 5. 主循环
    function tick() {
        const realB = parseFloat(document.getElementById('inputB').value);
        document.getElementById('txtRealB').innerText = realB.toFixed(1);

        const p1 = new THREE.Vector3(-realB/2, 2, 8);
        const p2 = new THREE.Vector3(realB/2, 2, 8);
        c1Model.position.copy(p1);
        c2Model.position.copy(p2);

        const s1 = scan(p1);
        const s2 = scan(p2);

        updatePoints(ptsL1, s1.map(v => v.local));
        updatePoints(ptsL2, s2.map(v => v.local));

        // 简易基线估算实现
        let bestB = 0, minErr = Infinity;
        for(let b=2; b<=12; b+=0.2) {
            let err = 0, count = 0;
            // 采样匹配
            for(let m=0; m<s1.length; m+=20) {
                let p1l = s1[m].local;
                let tx = p1l.x - b;
                let match = s2.find(p => Math.abs(p.local.x-tx)<0.3 && Math.abs(p.local.y-p1l.y)<0.3);
                if(match) { err += Math.pow(p1l.z-match.local.z, 2); count++; }
            }
            if(count > 20 && err/count < minErr) { minErr = err/count; bestB = b; }
        }
        document.getElementById('txtEstB').innerText = bestB.toFixed(1);

        // 还原拼接
        const rec = [];
        s1.forEach(v => rec.push(new THREE.Vector3(v.local.x - bestB/2, v.local.y+2, v.local.z+8)));
        s2.forEach(v => rec.push(new THREE.Vector3(v.local.x + bestB/2, v.local.y+2, v.local.z+8)));
        updatePoints(ptsRec, rec);

        // 渲染视口
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setScissorTest(true);

        renderer.setViewport(0, 260, w, h-260);
        renderer.setScissor(0, 260, w, h-260);
        renderer.render(sceneM, camM);

        renderer.setViewport(0, 0, w/2, 260);
        renderer.setScissor(0, 0, w/2, 260);
        renderer.render(sceneL1, camL1);

        renderer.setViewport(w/2, 0, w/2, 260);
        renderer.setScissor(w/2, 0, w/2, 260);
        renderer.render(sceneL2, camL2);

        renderer.setScissorTest(false);
        requestAnimationFrame(tick);
    }

    function updatePoints(obj, vecs) {
        const arr = new Float32Array(vecs.length * 3);
        for(let i=0; i<vecs.length; i++) {
            arr[i*3] = vecs[i].x; arr[i*3+1] = vecs[i].y; arr[i*3+2] = vecs[i].z;
        }
        obj.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        obj.geometry.attributes.position.needsUpdate = true;
    }

    regenScene();
    tick();
}
</script>
</body>
</html>
